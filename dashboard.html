<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard Guru - CAT Matematika VII</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#eef2f7;color:#182338}header{background:#173b72;color:#fff;padding:18px 24px;display:flex;justify-content:space-between;align-items:center}header h1{margin:0;font-size:20px}.wrap{max-width:1300px;margin:20px auto;padding:0 12px}.card{background:#fff;border-radius:14px;padding:20px;box-shadow:0 4px 18px #0001;margin-bottom:18px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}button,input{font-size:15px}button{padding:11px 16px;border:0;border-radius:8px;background:#173b72;color:#fff;cursor:pointer}button.secondary,.detail{background:#e7edf6;color:#173b72}input{padding:11px;border:1px solid #ccd4df;border-radius:8px}.api{flex:1;min-width:350px}.search{min-width:260px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{background:#f1f5fa;padding:16px;border-radius:10px}.stat b{display:block;font-size:27px;color:#173b72;margin-bottom:5px}.small{font-size:13px;color:#687386}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;margin-top:15px;min-width:1000px}th,td{padding:10px;border-bottom:1px solid #e1e6ee;text-align:left;font-size:14px;vertical-align:middle}th{background:#f1f5fa;position:sticky;top:0}.score{font-weight:700;color:#173b72}.ok{color:#1f7a45;font-weight:600}.bad{color:#b42318;font-weight:600}.empty{text-align:center;padding:30px;color:#687386}.modal{display:none;position:fixed;inset:0;background:#0008;z-index:20;padding:20px;overflow:auto}.modal.show{display:flex;align-items:flex-start;justify-content:center}.modal-box{background:#fff;border-radius:14px;max-width:1100px;width:100%;margin:20px auto;overflow:hidden}.modal-head{padding:18px 22px;background:#173b72;color:#fff;display:flex;justify-content:space-between;align-items:center}.modal-head h2{margin:0;font-size:19px}.close{background:#fff;color:#173b72;padding:8px 12px}.modal-body{padding:20px}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}.summary div{background:#f1f5fa;padding:12px;border-radius:9px;text-align:center}.summary b{display:block;font-size:22px;color:#173b72}.answer-table{min-width:750px}.answer-table th,.answer-table td{font-size:13px}.answer-table tr.correct{background:#f2fbf5}.answer-table tr.incorrect{background:#fff5f5}.answer-table tr.unanswered{background:#fffaf0}.pill{display:inline-block;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:700}.pill.correct{background:#dff4e7;color:#176638}.pill.incorrect{background:#fde1df;color:#a51d16}.pill.unanswered{background:#fff0c7;color:#8a6100}@media(max-width:750px){.stats,.summary{grid-template-columns:repeat(2,1fr)}.api,.search{min-width:100%}header h1{font-size:16px}}
</style></head><body>
<header><h1>Dashboard Guru — CAT Matematika Kelas VII</h1><div id="lastUpdate">Belum dimuat</div></header>
<div class="wrap"><div class="card"><h2 style="margin-top:0">Hasil Peserta</h2>
<div class="toolbar"><input id="api" class="api" value="https://script.google.com/macros/s/AKfycbx2ZZ6ymgXAtRWlRuS36VqOq8fnlLiDMN0vACupA1n7r65PevVq3aKhR-buv5x6FZYTLQ/exec"><button onclick="loadResults()">🔄 Muat Data</button><button class="secondary" onclick="downloadCSV()">⬇ Download CSV</button></div>
<div class="toolbar" style="margin-top:10px"><input id="search" class="search" placeholder="Cari nama siswa..." oninput="render()"><button class="secondary" onclick="resetSearch()">Reset</button></div><p id="status" class="small">Memuat data...</p></div>
<div class="card"><div class="stats"><div class="stat"><b id="total">0</b>Peserta</div><div class="stat"><b id="avg">0</b>Rata-rata nilai</div><div class="stat"><b id="high">0</b>Nilai tertinggi</div><div class="stat"><b id="low">0</b>Nilai terendah</div></div></div>
<div class="card"><h2 style="margin-top:0">Daftar Nilai</h2><div class="table-wrap"><table><thead><tr><th>No</th><th>Nama</th><th>Nilai</th><th>Benar</th><th>Salah</th><th>Mulai</th><th>Selesai</th><th>Durasi</th><th>Detail</th></tr></thead><tbody id="body"></tbody></table></div></div></div>
<div id="modal" class="modal" onclick="outside(event)"><div class="modal-box"><div class="modal-head"><h2 id="modalTitle">Detail Jawaban</h2><button class="close" onclick="closeModal()">✕ Tutup</button></div><div class="modal-body"><div id="modalSummary" class="summary"></div><div class="table-wrap"><table class="answer-table"><thead><tr><th>No</th><th>Soal</th><th>Jawaban Siswa</th><th>Kunci</th><th>Status</th></tr></thead><tbody id="answerBody"></tbody></table></div></div></div></div>
<script>
const API_URL=document.getElementById('api').value;let rows=[],questions=[];
async function loadQuestions(){try{let t=await fetch('siswa.html?x='+Date.now()).then(r=>r.text());let m=t.match(/const questions=(\[.*?\]);\s*let answers/s);if(m)questions=JSON.parse(m[1])}catch(e){console.log(e)}}
async function loadResults(){let url=document.getElementById('api').value.trim();document.getElementById('status').textContent='Sedang mengambil data...';try{if(!questions.length)await loadQuestions();let r=await fetch(url);if(!r.ok)throw Error(r.status);rows=await r.json();render();document.getElementById('lastUpdate').textContent='Update: '+new Date().toLocaleTimeString('id-ID');document.getElementById('status').textContent='Data berhasil dimuat: '+rows.length+' peserta.'}catch(e){document.getElementById('status').textContent='Gagal mengambil data. Periksa URL Web App dan aksesnya.';alert('Gagal mengambil data. Pastikan Web App dapat diakses oleh siapa saja.')}}
function render(){let q=document.getElementById('search').value.trim().toLowerCase(),f=rows.map((x,i)=>({...x,_i:i})).filter(x=>String(x.name||'').toLowerCase().includes(q)),b=document.getElementById('body');b.innerHTML='';if(!f.length)b.innerHTML='<tr><td colspan="9" class="empty">Belum ada data yang cocok.</td></tr>';else f.forEach((x,i)=>{let tr=document.createElement('tr');tr.innerHTML='<td>'+(i+1)+'</td><td>'+esc(x.name)+'</td><td class="score">'+(+x.score||0)+'</td><td class="ok">'+(+x.correct||0)+'</td><td class="bad">'+(+x.wrong||0)+'</td><td>'+fmt(x.startedAt)+'</td><td>'+fmt(x.finishedAt)+'</td><td>'+dur(x.durationSeconds)+'</td><td><button class="detail" onclick="showDetail('+x._i+')">👁 Lihat Detail</button></td>';b.appendChild(tr)});let sc=rows.map(x=>+x.score||0);document.getElementById('total').textContent=rows.length;document.getElementById('avg').textContent=rows.length?(sc.reduce((a,b)=>a+b,0)/rows.length).toFixed(1):0;document.getElementById('high').textContent=rows.length?Math.max(...sc):0;document.getElementById('low').textContent=rows.length?Math.min(...sc):0}
function showDetail(i){let x=rows[i],a=Array.isArray(x.answers)?x.answers:[];document.getElementById('modalTitle').textContent='Detail Jawaban — '+(x.name||'Tanpa Nama');document.getElementById('modalSummary').innerHTML='<div><b>'+(+x.score||0)+'</b>Nilai</div><div><b>'+(+x.correct||0)+'</b>Benar</div><div><b>'+(+x.wrong||0)+'</b>Salah</div><div><b>'+dur(x.durationSeconds)+'</b>Durasi</div>';let b=document.getElementById('answerBody');b.innerHTML='';questions.forEach((q,i)=>{let v=a[i],c=v===null||v===undefined||v===''?'unanswered':(+v===+q.a?'correct':'incorrect'),st=c==='correct'?'✓ Benar':c==='incorrect'?'✗ Salah':'Belum dijawab',sv=c==='unanswered'?'—':letter(v)+'. '+esc(q.o[v]),kv=letter(q.a)+'. '+esc(q.o[q.a]),tr=document.createElement('tr');tr.className=c;tr.innerHTML='<td>'+(i+1)+'</td><td>'+esc(q.q)+'</td><td>'+sv+'</td><td>'+kv+'</td><td><span class="pill '+c+'">'+st+'</span></td>';b.appendChild(tr)});document.getElementById('modal').classList.add('show');document.body.style.overflow='hidden'}
function letter(i){return String.fromCharCode(65+Number(i))}function closeModal(){document.getElementById('modal').classList.remove('show');document.body.style.overflow=''}function outside(e){if(e.target.id==='modal')closeModal()}function resetSearch(){document.getElementById('search').value='';render()}function fmt(v){if(!v)return'-';let d=new Date(v);return isNaN(d)?String(v):d.toLocaleString('id-ID')}function dur(v){let n=+v||0;return Math.floor(n/60)+' m '+n%60+' dtk'}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function downloadCSV(){if(!rows.length){alert('Muat data dahulu.');return}let h=['Nama','Nilai','Benar','Salah','Mulai','Selesai','Durasi(detik)','Jawaban'],l=[h,...rows.map(x=>[x.name,x.score,x.correct,x.wrong,x.startedAt,x.finishedAt,x.durationSeconds,JSON.stringify(x.answers||[])])].map(a=>a.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')),bl=new Blob(['\ufeff'+l.join('\n')],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(bl);a.download='hasil_CAT_Matematika_VII.csv';a.click();URL.revokeObjectURL(a.href)}
loadResults();
</script></body></html>
