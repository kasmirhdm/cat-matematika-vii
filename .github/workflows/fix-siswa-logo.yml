name: Fix UTS logo paths
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace broken inline logo SVGs
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('siswa.html')
          s=p.read_text(encoding='utf-8')
          pattern=r'src="data:image/svg\+xml;charset=UTF-8,<svg.*?</svg>"'
          n=[0]
          def repl(m):
              i=n[0]; n[0]+=1
              return 'src="logo-inhil.svg"' if i in (0,1) else 'src="logo-sekolah.svg"'
          s2=re.sub(pattern,repl,s,flags=re.S)
          if s2!=s:
              p.write_text(s2,encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add siswa.html
          git diff --cached --quiet || git commit -m "Fix UTS logo display"
          git push